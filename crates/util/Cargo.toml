[package]
name = "util"
version = "0.1.1"
edition.workspace = true
publish = false
license = "Apache-2.0"
description = "General-purpose path, shell, formatting and file cache utilities"


[lib]
path = "src/util.rs"
doctest = true

[dependencies]
tempfile = "3"
notify = "8.2"
async-channel = "2.5"
anyhow.workspace = true
globset.workspace = true
dunce.workspace = true
itertools.workspace = true
log.workspace = true
regex.workspace = true
schemars.workspace = true
serde.workspace = true
shlex.workspace = true
url.workspace = true
percent-encoding.workspace = true
rust-embed.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
which.workspace = true
dirs.workspace = true

[target.'cfg(unix)'.dependencies]
nix.workspace = true

[target.'cfg(windows)'.dependencies]
tendril.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true

[features]
logging = ["dep:tracing", "dep:tracing-subscriber", "dep:tracing-appender", "dep:tracing-log", "dep:time"]

[dependencies.tracing-subscriber]
version = "0.3"
features = ["env-filter"]
optional = true

[dependencies.tracing-appender]
version = "0.2"
optional = true

[dependencies.tracing-log]
version = "0.2"
optional = true

[dependencies.time]
version = "0.3"
features = ["parsing", "macros"]
optional = true

[dependencies.tracing]
workspace = true
optional = true
