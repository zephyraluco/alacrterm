[package]
name = "agent"
version = "0.1.5"
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
async-trait = "0.1"
futures.workspace = true
fs2 = "0.4"
rig-agent = { version = "=0.46.0", default-features = false }
rig-core = { version = "=0.46.0", default-features = false }
rig-memory = { version = "=0.46.0", features = ["fs"] }
rig-reqwest = "=0.46.0"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "system-proxy", "stream"] }
rmcp = { version = "3.7", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
url.workspace = true
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["net", "io-util"] }
