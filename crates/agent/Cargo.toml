[package]
name = "agent"
version = "0.1.5"
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
async-trait = "0.1"
futures.workspace = true
fs2 = "0.4"
rig-agent = { version = "=0.46.0", default-features = false }
rig-core = { version = "=0.46.0", default-features = false }
rig-memory = "=0.46.0"
rusqlite = { version = "0.37", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
url.workspace = true
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }
solaris-agent = { git = "https://github.com/zephyraluco/solaris", rev = "cacc40e018018e16afeaa21ab74689b1cc4acbd3" }
solaris-backend = { git = "https://github.com/zephyraluco/solaris", rev = "cacc40e018018e16afeaa21ab74689b1cc4acbd3" }
solaris-provider = { git = "https://github.com/zephyraluco/solaris", rev = "cacc40e018018e16afeaa21ab74689b1cc4acbd3" }
solaris-tools = { git = "https://github.com/zephyraluco/solaris", rev = "cacc40e018018e16afeaa21ab74689b1cc4acbd3" }
solaris-types = { git = "https://github.com/zephyraluco/solaris", rev = "cacc40e018018e16afeaa21ab74689b1cc4acbd3" }
solaris-mcp = { git = "https://github.com/zephyraluco/solaris", rev = "cacc40e018018e16afeaa21ab74689b1cc4acbd3" }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["net", "io-util"] }
