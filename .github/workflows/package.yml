name: package
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  package:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: windows-2022
            platform: windows-x64
          - runner: macos-14
            platform: macos-arm64
    runs-on: ${{ matrix.runner }}
    env:
      ALACRTERM_UPDATE_PUBLIC_KEYS: ${{ vars.ALACRTERM_UPDATE_PUBLIC_KEYS }}
      SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          shared-key: release-build
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake clang libfontconfig1-dev libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libegl1-mesa-dev libvulkan-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev libasound2-dev
      - uses: actions/cache@v5
        if: runner.os == 'macOS'
        with:
          path: target/sparkle-download
          key: sparkle-${{ runner.os }}-${{ hashFiles('scripts/packaging/fetch_sparkle.py') }}
      - name: Prepare Sparkle
        if: runner.os == 'macOS'
        run: bash scripts/packaging/prepare_sparkle.sh
      - name: Packaging regression tests
        run: python -m unittest discover -s scripts/test -p 'test_*.py'
      - name: Build
        run: cargo build --release --locked -p alacrterm -p alacrterm-update-helper
      - name: Create installer
        run: python scripts/packaging/package.py
      - name: Write build identity and integrity manifest
        run: python scripts/packaging/artifacts.py write --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: installer-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
