name: package
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: windows-2022
            platform: windows-x64
          - runner: macos-14
            platform: macos-arm64
    runs-on: ${{ matrix.runner }}
    env:
      ALACRTERM_UPDATE_PUBLIC_KEYS: ${{ vars.ALACRTERM_UPDATE_PUBLIC_KEYS }}
      SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.3
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake clang libfontconfig1-dev libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libegl1-mesa-dev libvulkan-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev libasound2-dev
      - name: Prepare Sparkle
        if: runner.os == 'macOS'
        run: bash scripts/packaging/prepare_sparkle.sh
      - name: Import Apple signing credentials
        if: runner.os == 'macOS' && inputs.release
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: bash scripts/packaging/import_apple_signing.sh
      - name: Packaging regression tests
        run: python -m unittest discover -s scripts/test -p 'test_*.py'
      - name: Build
        run: cargo build --release --locked -p alacrterm -p alacrterm-update-helper
      - name: Create installer
        run: python scripts/packaging/package.py
      - name: Sign Sparkle upgrade package
        if: runner.os == 'macOS' && inputs.release
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: python3 scripts/packaging/sign_sparkle.py
      - name: Remove Apple signing credentials
        if: always() && runner.os == 'macOS' && inputs.release
        run: bash scripts/packaging/remove_apple_signing.sh
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: installer-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
