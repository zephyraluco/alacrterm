name: release
on:
  push:
    tags: ['*']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate stable tag and update signing configuration
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          ALACRTERM_UPDATE_PUBLIC_KEYS: ${{ vars.ALACRTERM_UPDATE_PUBLIC_KEYS }}
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: python3 scripts/packaging/validate_release.py
  checks:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    permissions:
      contents: read
      actions: read
    outputs:
      package_run_id: ${{ steps.resolve.outputs.package_run_id }}
      rebuild: ${{ steps.resolve.outputs.rebuild }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Resolve successful branch CI and installer artifacts
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: python3 scripts/packaging/resolve_ci.py
  rebuild:
    needs: checks
    if: needs.checks.outputs.rebuild == 'true'
    uses: ./.github/workflows/package.yml
  sign:
    needs: [checks, rebuild]
    if: ${{ !cancelled() && needs.checks.result == 'success' && (needs.rebuild.result == 'success' || needs.rebuild.result == 'skipped') }}
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_SHA: ${{ github.sha }}
      PACKAGE_RUN_ID: ${{ needs.checks.outputs.rebuild == 'true' && github.run_id || needs.checks.outputs.package_run_id }}
      ALACRTERM_UPDATE_PUBLIC_KEYS: ${{ vars.ALACRTERM_UPDATE_PUBLIC_KEYS }}
      SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Download and verify exact installer set
        run: python3 scripts/packaging/download_installers.py
      - uses: actions/cache@v5
        with:
          path: target/sparkle-download
          key: sparkle-${{ runner.os }}-${{ hashFiles('scripts/packaging/fetch_sparkle.py') }}
      - name: Prepare Sparkle signing tools
        run: bash scripts/packaging/prepare_sparkle.sh
      - name: Sign final Sparkle upgrade ZIP
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: python3 scripts/packaging/sign_sparkle.py
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-sparkle-signature
          path: dist/sparkle-signature.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true
  release:
    needs: [checks, sign]
    if: ${{ !cancelled() && needs.checks.result == 'success' && needs.sign.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: alacrterm-release-publication
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_SHA: ${{ github.sha }}
      PACKAGE_RUN_ID: ${{ needs.checks.outputs.rebuild == 'true' && github.run_id || needs.checks.outputs.package_run_id }}
      ALACRTERM_UPDATE_PUBLIC_KEYS: ${{ vars.ALACRTERM_UPDATE_PUBLIC_KEYS }}
      SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Download and verify exact installer set
        run: python3 scripts/packaging/download_installers.py
      - name: Check for an already published complete release
        id: publication
        run: python3 scripts/packaging/publish_release.py --check
      - uses: actions/download-artifact@v8.0.2
        if: steps.publication.outputs.already_published != 'true'
        with:
          name: release-sparkle-signature
          path: dist
      - name: Install metadata signing tool
        if: steps.publication.outputs.already_published != 'true'
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Generate release notes and signed update feeds
        if: steps.publication.outputs.already_published != 'true'
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: bash scripts/packaging/generate_release_feeds.sh
      - name: Publish complete GitHub Release
        if: steps.publication.outputs.already_published != 'true'
        run: bash scripts/packaging/publish_release.sh
